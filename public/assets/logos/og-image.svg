      <stop offset="0%" style="stop-color:#0f1b3d"/>
      <stop offset="100%" style="stop-color:#1a3066"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5b041"/>
      <stop offset="100%" style="stop-color:#d4942d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="530" r="300" fill="#ffffff" opacity="0.02"/>
  <circle cx="1100" cy="100" r="200" fill="#ffffff" opacity="0.02"/>
  <circle cx="600" cy="315" r="400" fill="#f5b041" opacity="0.03"/>

  <!-- Shield icon large -->
  <g transform="translate(80, 180)">
    <path d="M25 5 L75 5 Q100 5 100 30 L100 50 Q100 80 50 100 Q0 80 0 50 L0 30 Q0 5 25 5 Z"
