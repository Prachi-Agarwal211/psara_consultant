    <circle cx="160" cy="350" r="22" stroke="url(#gold)" stroke-width="1.2" fill="none" opacity="0.7"/>
    <text x="160" y="354" text-anchor="middle" fill="#D4AF37" font-size="9" font-family="Georgia, serif">SEAL</text>
