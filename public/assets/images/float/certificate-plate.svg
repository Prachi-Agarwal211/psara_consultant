    <path d="M160 68 L168 88 L190 90 L172 104 L178 126 L160 114 L142 126 L148 104 L130 90 L152 88 Z" fill="url(#gold)" opacity="0.92"/>
    <text x="160" y="150" text-anchor="middle" fill="#D4AF37" font-family="Georgia, serif" font-size="11" letter-spacing="3">GOVERNMENT OF INDIA</text>
    <text x="160" y="188" text-anchor="middle" fill="#F5F3F0" font-family="Georgia, serif" font-size="22" font-weight="700">PSARA LICENSE</text>
    <text x="160" y="214" text-anchor="middle" fill="#E8C550" font-family="Georgia, serif" font-size="12" letter-spacing="1.5">Private Security Agencies</text>
    <text x="160" y="234" text-anchor="middle" fill="rgba(245,243,240,0.55)" font-family="Georgia, serif" font-size="11">Regulation Act, 2005</text>
