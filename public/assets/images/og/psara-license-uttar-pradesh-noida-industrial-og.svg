<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient with spotlight -->
    <radialGradient id="spot" cx="65%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#c9945b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#241e16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#c9945b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6fafd"/>
      <stop offset="100%" stop-color="#f6fafd" stop-opacity="0.85"/>
    </linearGradient>
    <!-- Gold shimmer for brand mark -->
    <linearGradient id="goldShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9945b"/>
      <stop offset="50%" stop-color="#f3df9a"/>
      <stop offset="100%" stop-color="#c9945b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#241e16"/>
  <rect width="1200" height="630" fill="url(#spot)"/>

  <!-- Brand Mark (top-left) -->
  <!-- PSARA letters stacked like a seal -->
  <g transform="translate(50, 45)">
    <text font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#c9945b" letter-spacing="3">PSARA</text>
    <text font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#c9945b" opacity="0.5" y="18" letter-spacing="1">CONSULTANT INDIA</text>
  </g>

  <!-- Brand URL (top-right) -->
  <text x="1150" y="58" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#c9945b" opacity="0.35" letter-spacing="1">psaraconsultantindia.com</text>

  <!-- Decorative top line -->
  <rect x="50" y="80" width="1100" height="1" fill="url(#line)"/>

  <!-- Left accent bar -->
  <rect x="50" y="120" width="3" height="340" fill="#c9945b" opacity="0.15" rx="1.5"/>

  <!-- Category Badge -->
  <rect x="75" y="130" width="126" height="28" rx="4" fill="#c9945b" opacity="0.12"/>
  <text x="90" y="148" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c9945b" letter-spacing="1.5">STATE GUIDES</text>

  <!-- Post Title — large, readable at small card sizes -->
  <text x="75" y="240" font-family="system-ui, sans-serif" font-size="52" font-weight="700" fill="url(#titleGrad)" letter-spacing="-0.3">
    <tspan x="75" dy="0">PSARA License</tspan>
    <tspan x="75" dy="65">in UP</tspan>
  </text>

  <!-- Subtle decorative diamond markers -->
  <rect x="75" y="330" width="6" height="6" rx="0" transform="rotate(45 78 333)" fill="#c9945b" opacity="0.1"/>
  <rect x="91" y="330" width="6" height="6" rx="0" transform="rotate(45 94 333)" fill="#c9945b" opacity="0.06"/>

  <!-- Read indicator dots (decorative) -->
  <circle cx="75" cy="365" r="2.5" fill="#c9945b" opacity="0.12"/>
<circle cx="95" cy="365" r="2.5" fill="#c9945b" opacity="0.16"/>
<circle cx="115" cy="365" r="2.5" fill="#c9945b" opacity="0.2"/>

  <!-- Bottom section with brand info -->
  <rect x="50" y="400" width="1100" height="1" fill="url(#line)"/>

  <!-- Pillar stat: 300+ Agencies | 28 States | 5.0 Rating -->
  <g transform="translate(75, 430)">
    <text font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#c9945b">300+</text>
    <text font-family="system-ui, sans-serif" font-size="10" fill="#f6fafd" opacity="0.4" x="0" y="16" letter-spacing="1">AGENCIES SERVED</text>

    <text font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#c9945b" x="140">28</text>
    <text font-family="system-ui, sans-serif" font-size="10" fill="#f6fafd" opacity="0.4" x="140" y="16" letter-spacing="1">STATES COVERED</text>

    <text font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#c9945b" x="260">5.0</text>
    <text font-family="system-ui, sans-serif" font-size="10" fill="#f6fafd" opacity="0.4" x="260" y="16" letter-spacing="1">GOOGLE RATING</text>
  </g>

  <!-- Ghost watermark -->
  <text x="1150" y="580" text-anchor="end" font-family="system-ui, sans-serif" font-size="80" font-weight="900" fill="#c9945b" opacity="0.03" letter-spacing="-4">PSARA</text>

  <!-- Bottom corner ornament BL -->
  <path d="M50 560 L50 580 L70 580" stroke="#c9945b" stroke-width="1" fill="none" opacity="0.2"/>
  <!-- Bottom corner ornament BR -->
  <path d="M1150 580 L1130 580 L1130 560" stroke="#c9945b" stroke-width="1" fill="none" opacity="0.2"/>

  <!-- Footer URL -->
  <text x="600" y="595" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#f6fafd" opacity="0.12" letter-spacing="2">PSARACONSULTANTINDIA.COM</text>
</svg>