<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5b041"/>
      <stop offset="100%" style="stop-color:#d4942d"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1b3d"/>
      <stop offset="100%" style="stop-color:#1a3066"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#g1)" stroke-width="4"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#0f1b3d" stroke-width="1.5"/>

  <!-- Inner ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#g1)" stroke-width="1.5"/>

  <!-- Text around circle -->
  <path id="arc" d="M100 20 A80 80 0 1 1 99.9 20" fill="none"/>
  <text font-size="10" font-weight="700" fill="#0f1b3d" letter-spacing="3">
    <textPath href="#arc" startOffset="50%" text-anchor="middle">PSARA CONSULTANT INDIA</textPath>
  </text>

  <!-- Inner shield -->
  <path d="M100 35 L135 55 L135 85 Q135 120 100 140 Q65 120 65 85 L65 55 Z"
        fill="url(#g2)" stroke="url(#g1)" stroke-width="2"/>

  <!-- Star -->
  <polygon points="100,55 104,67 117,67 107,75 110,88 100,80 90,88 93,75 83,67 96,67"
           fill="url(#g1)"/>

  <!-- Text below -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#0f1b3d" text-anchor="middle" letter-spacing="1">LICENSED & TRUSTED</text>
  <text x="100" y="182" font-family="Arial, sans-serif" font-size="7" fill="#888" text-anchor="middle">PSARA License Experts</text>
</svg>