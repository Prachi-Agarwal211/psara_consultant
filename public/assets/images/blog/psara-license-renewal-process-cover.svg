<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="spot" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1fb87a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#1fb87a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6fafd"/>
      <stop offset="100%" stop-color="#f6fafd" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a1a"/>
  <rect width="1200" height="630" fill="url(#spot)"/>

  <!-- Noise texture overlay -->
  <rect width="1200" height="630" fill="#1a1a1a" opacity="0.03" filter="url(#noise)"/>

  <!-- Top decorative border -->
  <rect x="40" y="30" width="1120" height="1" fill="url(#line)"/>
  <rect x="40" y="599" width="1120" height="1" fill="url(#line)"/>

  <!-- Corner ornament TL -->
  <path d="M40 70 L40 40 L70 40" stroke="#1fb87a" stroke-width="1.5" fill="none" opacity="0.4"/>
  <!-- Corner ornament TR -->
  <path d="M1160 40 L1130 40 L1130 70" stroke="#1fb87a" stroke-width="1.5" fill="none" opacity="0.4"/>
  <!-- Corner ornament BL -->
  <path d="M40 560 L40 590 L70 590" stroke="#1fb87a" stroke-width="1.5" fill="none" opacity="0.4"/>
  <!-- Corner ornament BR -->
  <path d="M1160 590 L1130 590 L1130 560" stroke="#1fb87a" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Small gold diamond markers -->
  <rect x="596" y="50" width="8" height="8" rx="0" transform="rotate(45 600 54)" fill="#1fb87a" opacity="0.15"/>

  <!-- Category badge -->
  <rect x="525" y="100" width="150" height="30" rx="4" fill="#1fb87a" opacity="0.15"/>
  <text x="600" y="119" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1fb87a" letter-spacing="2" text-transform="uppercase">COMPLIANCE</text>

  <!-- Ghost display text (decorative background) -->
  <text x="40" y="540" font-family="system-ui, sans-serif" font-size="120" font-weight="900" fill="#1fb87a" opacity="0.04" letter-spacing="-4">PSARA</text>

  <!-- Publish date line -->
  <text x="600" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1fb87a" opacity="0.4" letter-spacing="3">www.psaraconsultantindia.com</text>

  <!-- Gold line separator -->
  <rect x="400" y="520" width="400" height="1" fill="url(#line)"/>

  <!-- Title -->
  <text x="80" y="300" font-family="system-ui, sans-serif" font-size="38" font-weight="700" fill="url(#titleGrad)" letter-spacing="-0.5">
    <tspan x="100" dy="0">PSARA Renewal</tspan>
    <tspan x="100" dy="55">Process</tspan>
  </text>

  <!-- Reading indicator dots -->
  <circle cx="100" cy="420" r="2.5" fill="#1fb87a" opacity="0.15000000000000002"/>
<circle cx="116" cy="420" r="2.5" fill="#1fb87a" opacity="0.2"/>
<circle cx="132" cy="420" r="2.5" fill="#1fb87a" opacity="0.25"/>
<circle cx="148" cy="420" r="2.5" fill="#1fb87a" opacity="0.30000000000000004"/>

  <!-- Bottom decorative line -->
  <rect x="100" y="445" width="300" height="1" fill="#1fb87a" opacity="0.08"/>
</svg>